apiVersion: v1
kind: Pod
metadata:
  name: p2p-server-0
  labels:
    app: p2p-server
    domain: blockchain
    pod-index: '0'
spec:
  containers:
    - name: p2p-server
      image: lebaz20/blockchain-rapidchain-p2p-server:latest
      imagePullPolicy: Never
      resources:
        limits:
          memory: 256Mi
          cpu: 180m
      env:
        - name: SECRET
          value: NODE0
        - name: IS_FAULTY
          value: 'false'
        - name: SHOULD_REDIRECT_FROM_FAULTY_NODES
          value: 'false'
        - name: P2P_PORT
          value: '5001'
        - name: HTTP_PORT
          value: '3001'
        - name: TRANSACTION_THRESHOLD
          value: '20'
        - name: BLOCK_THRESHOLD
          value: '2'
        - name: NUMBER_OF_NODES_PER_SHARD
          value: '16'
        - name: NUMBER_OF_NODES
          value: '48'
        - name: NODES_SUBSET
          value: '[43,36,38,37,32,27,1,25,11,2,0,42,30,40,12,21]'
        - name: SUBSET_INDEX
          value: SUBSET2
        - name: COMMITTEE_SUBSET_INDEX
          value: SUBSET_COMMITTEE
        - name: CORE
          value: ws://core-server:4999
        - name: CPU_LIMIT
          value: '0.18'
        - name: DEFAULT_TTL
          value: '6'
        - name: NODE_OPTIONS
          value: ''
      ports:
        - containerPort: 3001
        - containerPort: 5001
      readinessProbe:
        httpGet:
          path: /health
          port: 3001
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
  restartPolicy: OnFailure
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-server-0
  labels:
    app: p2p-server
    domain: blockchain
spec:
  clusterIP: None
  selector:
    app: p2p-server
    pod-index: '0'
  ports:
    - name: '5001'
      protocol: TCP
      port: 5001
      targetPort: 5001
    - name: '3001'
      protocol: TCP
      port: 3001
      targetPort: 3001
---
